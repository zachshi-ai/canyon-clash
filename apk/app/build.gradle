plugins { id 'com.android.application' }

android {
    namespace 'ai.zach.canyon'
    compileSdk 34

    defaultConfig {
        applicationId "ai.zach.canyon"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "1.1"
    }

    signingConfigs {
        release {
            storeFile file("../canyon.keystore")
            storePassword "canyon"
            keyAlias "canyon"
            keyPassword "canyon"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
